<template>
  <style>
    #wm-root {
      position: absolute;
      inset: 0;
      background: var(--bg, #08090c);
      display: grid;
      place-items: center;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #wm-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      grid-template-rows: repeat(14, 1fr);
      opacity: 0.28;
    }

    #wm-grid i {
      width: 3px;
      height: 3px;
      border-radius: 1px;
      background: var(--fg, #f4f5f7);
      place-self: center;
      opacity: 0;
    }

    #wm-stack { position: relative; z-index: 2; }

    /* Visible at frame 0 — the first frame is the thumbnail on social players.
       The mark settles into place instead of entering from nothing. */
    #wm-mark {
      font-size: 172px;
      font-weight: 800;
      letter-spacing: -0.045em;
      color: var(--fg, #f4f5f7);
      line-height: 1;
      opacity: 1;
    }

    #wm-mark em {
      font-style: normal;
      color: var(--accent, #7dd3fc);
    }

    #wm-rule {
      position: absolute;
      left: 50%;
      bottom: -44px;
      height: 3px;
      width: 0;
      background: var(--accent, #7dd3fc);
      transform: translateX(-50%);
    }
  </style>

  <div id="wm-root" data-composition-id="wordmark" data-width="1920" data-height="1080">
    <div id="wm-grid"></div>
    <div id="wm-stack">
      <div id="wm-mark">MOT<em>IONS</em></div>
      <div id="wm-rule"></div>
    </div>
  </div>

  <script>
    (function () {
      // Deterministic dot field: seeded LCG, identical every render.
      var grid = document.getElementById("wm-grid");
      var frag = document.createDocumentFragment();
      var seed = 20240517;
      var rnd = function () {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      for (var i = 0; i < 24 * 14; i++) {
        var dot = document.createElement("i");
        var r = rnd();
        dot.dataset.o = r <= 0.55 ? String(0.25 + r * 1.1) : "0";
        frag.appendChild(dot);
      }
      grid.appendChild(frag);

      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      // The mark is already on screen at local frame 0 and settles; it never
      // enters from an empty frame.
      tl.fromTo(
        "#wm-mark",
        { y: 34, scale: 0.985, filter: "blur(7px)" },
        { y: 0, scale: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out" },
        0,
      );

      tl.fromTo(
        "#wm-grid i",
        { opacity: 0, scale: 0 },
        {
          opacity: function (i, el) {
            return Number(el.dataset.o) || 0;
          },
          scale: 1,
          duration: 0.5,
          ease: "power2.out",
          stagger: { each: 0.005, from: "center", grid: [14, 24], axis: null },
        },
        0.15,
      );

      tl.fromTo("#wm-rule", { width: 0 }, { width: 520, duration: 0.7, ease: "power4.out" }, 0.9);

      // exit — cinematic zoom: the mark pushes through the camera and finishes
      // ON the cut (2.5 s). Clearing early leaves black frames on the downbeat.
      tl.to(
        "#wm-root",
        { scale: 1.14, opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" },
        2.1,
      );

      window.__timelines["wordmark"] = tl;
    })();
  </script>
</template>
