      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // arrive from just behind the previous beat's zoom
      tl.fromTo(
        "#lk-inner",
        { scale: 0.92, filter: "blur(6px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },

      // Settles by 0.9 s and holds to the end: a closing line needs ~2 s on
      // screen to read at play speed.
      tl.fromTo(
        "#lk-tag",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.3,
      );

      window.__timelines["lockup"] = tl;
