<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>MotionBrief intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=block"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #08090c;
        --fg: #f4f5f7;
        --dim: #8b93a1;
        --accent: #7dd3fc;
        --panel: #0d0f14;
        --line: rgba(244, 245, 247, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
      }

      body {
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      #vignette {
        position: absolute;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        background: radial-gradient(
          120% 90% at 50% 45%,
          transparent 45%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
    </style>
  </head>
  <body>
    <!--
      MotionBrief intro — 17 s at 60 fps, five nested compositions.
      Every cut sits on the 120 BPM grid (0.5 s). Music is muxed afterwards by
      scripts/motion-render.mjs, so the composition stays video-only.
    -->
    <div
      id="root"
      data-composition-id="motionbrief-intro"
      data-start="0"
      data-duration="17"
      data-width="1920"
      data-height="1080"
      data-fps="60"
      data-no-timeline
    >
      <div
        id="scene-logo"
        data-composition-id="logo"
        data-composition-src="./compositions/logo.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-sentence"
        data-composition-id="sentence"
        data-composition-src="./compositions/sentence.html"
        data-start="4"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-grid"
        data-composition-id="grid"
        data-composition-src="./compositions/grid.html"
        data-start="7"
        data-duration="3.5"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-same"
        data-composition-id="same"
        data-composition-src="./compositions/same.html"
        data-start="10.5"
        data-duration="2.5"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-lockup"
        data-composition-id="lockup"
        data-composition-src="./compositions/lockup.html"
        data-start="13"
        data-duration="4"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>

      <div id="vignette"></div>
    </div>
  </body>
</html>
