  <div id="lk-root" data-composition-id="lockup" data-width="1920" data-height="1080">
    <div id="lk-glow"></div>

      <div id="lk-row">
        <svg id="lk-mark" viewBox="0 0 200 200" aria-hidden="true">
          <rect x="8" y="8" width="184" height="184" rx="50" fill="#7dd3fc" />
          <g fill="#08090c" stroke="#08090c" stroke-width="5" stroke-linejoin="round">
            <polygon points="68,58 68,58 87.1,69 106.2,80 68,80" />

            <polygon points="68,120 106.2,120 87.1,131 68,142 68,142" />
          </g>

        <div id="lk-word" aria-label="MotionBrief">MotionBrief</div>

      <div id="lk-tag">A brief your agent can't drift from.</div>

  <script>
    (function () {
      function split(el, cls) {
        var text = el.textContent;
        el.textContent = "";
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.className = cls(i);
          s.textContent = text[i];
          el.appendChild(s);
        }
      }
      split(document.getElementById("lk-word"), function (i) { return i >= 6 ? "ch acc" : "ch"; });
      split(document.getElementById("lk-cmd-text"), function () { return "k"; });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // arrive from just behind the previous beat's push
      tl.fromTo("#lk-inner", { scale: 0.9, filter: "blur(8px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);

      // the mark is an object: it may overshoot; the type never does
      tl.fromTo("#lk-mark", { scale: 0.55, opacity: 0.45 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "back.out(1.7)" }, 0);
      tl.fromTo("#lk-word .ch", { yPercent: 115 },
        { yPercent: 0, duration: 0.6, ease: "power4.out", stagger: 0.025 }, 0.12);

      tl.fromTo("#lk-tag", { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.4);

      // install command types on, then holds to the last frame
      tl.fromTo("#lk-cmd", { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.6);
      tl.fromTo("#lk-cmd .k", { opacity: 0 },
        { opacity: 1, duration: 0.01, ease: "none", stagger: 0.016 }, 0.8);

      // settled by ~1.45 s; holds 2.6 s to the end — no exit, last frame is the card
      window.__timelines["lockup"] = tl;
    })();
  </script>
