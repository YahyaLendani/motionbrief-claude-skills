<template>
  <style>
    #gr-root {
      position: absolute;
      inset: 0;
      background: var(--bg, #08090c);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    #gr-title {
      position: absolute;
      left: 0;
      right: 0;
      top: 222px;
      text-align: center;
      font-size: 80px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--fg, #f4f5f7);
    }

    #gr-title .w { display: inline-block; margin: 0 0.12em; }

    #gr-panel {
      position: absolute;
      left: 210px;
      top: 400px;
      width: 1500px;
      height: 440px;
      border-radius: 28px;
      border: 2px solid var(--line, rgba(244, 245, 247, 0.12));
      background: var(--panel, #0d0f14);
    }

    #gr-tab {
      position: absolute;
      left: 60px;
      top: 40px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 42px;
      font-weight: 700;
      color: var(--accent, #7dd3fc);
    }

    #gr-meta {
      position: absolute;
      right: 60px;
      top: 44px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 40px;
      font-weight: 500;
      color: var(--dim, #8b93a1);
    }

    #gr-track {
      position: absolute;
      left: 60px;
      top: 150px;
      width: 1380px;
      height: 300px;
    }

    .gr-tick {
      position: absolute;
      bottom: 230px;
      width: 3px;
      margin-left: -1.5px;
      height: 22px;
      border-radius: 2px;
      background: var(--dim, #8b93a1);
      opacity: 0.4;
      transform-origin: 50% 100%;
    }

    .gr-tick.bar { height: 40px; }

    .gr-block {
      position: absolute;
      top: 100px;
      height: 120px;
      border-radius: 18px;
      border: 2px solid rgba(125, 211, 252, 0.45);
      background: rgba(125, 211, 252, 0.08);
      display: flex;
      align-items: center;
      padding-left: 22px;
      overflow: hidden;
      transform-origin: 0% 50%;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 36px;
      font-weight: 500;
      color: var(--fg, #f4f5f7);
    }

    #gr-head {
      position: absolute;
      top: 40px;
      left: 0;
      width: 4px;
      height: 210px;
      margin-left: -2px;
      background: var(--accent, #7dd3fc);
      box-shadow: 0 0 24px rgba(125, 211, 252, 0.6);
      opacity: 0;
    }

    #gr-head::before {
      content: "";
      position: absolute;
      left: -10px;
      top: -12px;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent, #7dd3fc);
      transform: rotate(45deg);
    }

    .mb-brace {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 160px;
      font-weight: 700;
      line-height: 1;
      color: var(--accent, #7dd3fc);
    }
  </style>

  <div id="gr-root" data-composition-id="grid" data-width="1920" data-height="1080">
    <div id="gr-title">Every cut, every hold, every word.</div>
    <div id="gr-panel">
      <div id="gr-tab">brief.json</div>
      <div id="gr-meta">120 BPM · 60 fps · 17 s</div>
      <div id="gr-track">
        <div id="gr-head"></div>
      </div>
    </div>
    <div id="gr-brace" class="mb-brace"><span id="gr-bl">{</span><span id="gr-br">}</span></div>
  </div>

  <script>
    (function () {
      var W = 1380;
      var LEN = 17; // seconds on the ruler
      var BEATS = [
        ["logo", 0, 4],
        ["sentence", 4, 3],
        ["grid", 7, 3.5],
        ["same", 10.5, 2.5],
        ["lockup", 13, 4],
      ];
      var track = document.getElementById("gr-track");

      // Ruler: a tick every 0.5 s (one beat at 120 BPM), taller every second.
      var nTicks = LEN * 2;
      for (var i = 0; i <= nTicks; i++) {
        var t = document.createElement("i");
        t.className = i % 2 === 0 ? "gr-tick bar" : "gr-tick";
        t.style.left = (i / nTicks) * W + "px";
        track.appendChild(t);
      }

      BEATS.forEach(function (b) {
        var d = document.createElement("div");
        d.className = "gr-block";
        d.style.left = (b[1] / LEN) * W + "px";
        d.style.width = (b[2] / LEN) * W - 8 + "px";
        d.textContent = b[0];
        track.appendChild(d);
      });

      var title = document.getElementById("gr-title");
      var words = title.textContent.split(" ");
      title.textContent = "";
      words.forEach(function (w, i) {
        var s = document.createElement("span");
        s.className = "w";
        s.textContent = w;
        title.appendChild(s);
      });

      function build() {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var bl = document.getElementById("gr-bl");
        var br = document.getElementById("gr-br");
        var b0 = bl.getBoundingClientRect();
        var b1 = br.getBoundingClientRect();
        var host = document.getElementById("gr-root").getBoundingClientRect();

        // 0.00 — { } opens into the brief panel.
        tl.to("#gr-bl", { x: host.left + 210 - (b0.left + b0.width / 2), duration: 0.6, ease: "expo.inOut" }, 0);
        tl.to("#gr-br", { x: host.left + 1710 - (b1.left + b1.width / 2), duration: 0.6, ease: "expo.inOut" }, 0);
        tl.to("#gr-bl, #gr-br", { opacity: 0, duration: 0.2, ease: "power1.in" }, 0.42);
        tl.fromTo("#gr-panel", { scaleX: 0.08, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.6, ease: "expo.inOut" }, 0);

        tl.fromTo("#gr-tab, #gr-meta", { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 0.4);
        tl.fromTo("#gr-title .w", { y: 44, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power4.out", stagger: 0.06 }, 0.3);

        // 0.45 — the beat ruler, then the five beats snap onto it.
        tl.fromTo(".gr-tick", { scaleY: 0 },
          { scaleY: 1, duration: 0.3, ease: "power3.out", stagger: 0.011 }, 0.45);
        tl.fromTo(".gr-block", { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "back.out(1.3)", stagger: 0.12 }, 0.6);

        // 1.00 — the playhead plays the brief; each tick it crosses lights,
        // each beat brightens as it starts.
        var T0 = 1.0, SWEEP = 1.9;
        tl.to("#gr-head", { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.85);
        tl.fromTo("#gr-head", { x: 0 }, { x: W, duration: SWEEP, ease: "none" }, T0);
        document.querySelectorAll(".gr-tick").forEach(function (tk, i) {
          tl.to(tk, { opacity: 1, backgroundColor: "#7dd3fc", duration: 0.08, ease: "none" }, T0 + (i / nTicks) * SWEEP);
        });
        document.querySelectorAll(".gr-block").forEach(function (bk, i) {
          tl.to(bk, {
            borderColor: "rgba(125, 211, 252, 1)",
            backgroundColor: "rgba(125, 211, 252, 0.2)",
            duration: 0.15, ease: "power2.out",
          }, T0 + (BEATS[i][1] / LEN) * SWEEP);
        });

        // 3.10 — exit: whip-pan left, finishing on the cut.
        tl.to("#gr-root", { x: -760, opacity: 0.3, filter: "blur(22px)", duration: 0.4, ease: "power3.in" }, 3.1);

        window.__timelines["grid"] = tl;
      }

      document.fonts.ready.then(build);
    })();
  </script>
</template>
